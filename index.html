<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfe">
  <meta name="description" content="frazyy's website">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://frazyy.com/">
  <meta property="og:site_name" content="frazyy">
  <meta property="og:title" content="frazyy">
  <meta property="og:description" content="cat content creator">
  <meta property="og:image" content="https://frazyy.com/img/frazyypfp.png">
  <meta property="og:image:alt" content="frazyy">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="frazyy">
  <meta name="twitter:description" content="cat content creator">
  <meta name="twitter:image" content="https://frazyy.com/img/frazyypfp.png">
  <title>frazyy</title>

  <style>
    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientifica.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaItalic.ttf") format("truetype");
      font-style: italic;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --top: #fcfbfe;
      --ink: #b197e1;
      --ink-dark: #9677ce;
      --button-fill: #b197e1;
      --button-hover: #a486d8;
      --focus: #7552b4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      color: var(--ink);
      background: var(--top);
      font-family: "Scientifica", monospace;
      font-size: 20px;
      line-height: 1.35;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
    }

    #fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: blur(0.6px);
    }

    .is-loading main,
    .is-loading #fx {
      opacity: 0;
    }

    .is-loading main {
      transform: translateY(10px);
    }

    .is-ready main {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 760ms ease-out,
        transform 760ms cubic-bezier(0.22, 0.75, 0.3, 1);
    }

    .is-ready #fx {
      opacity: 1;
      transition: opacity 1s ease-out;
    }

    .profile {
      display: grid;
      grid-template-columns: 225px minmax(0, 1fr);
      align-items: center;
      gap: 34px;
    }

    .pfp-wrap {
      position: relative;
      width: 225px;
      aspect-ratio: 1;
    }

    .pfp {
      display: block;
      width: 100%;
      height: 100%;
      border: 2px solid rgba(177, 151, 225, 0.6);
      border-radius: 50%;
      object-fit: cover;
    }

    .deco {
      position: absolute;
      z-index: 2;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .content {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink-dark);
      font-size: clamp(62px, 7vw, 84px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px rgba(150, 119, 206, 0.42),
        0 0 20px rgba(177, 151, 225, 0.28);
    }

    .intro {
      margin: 11px 0 17px;
      font-size: 23px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .link {
      min-height: 70px;
      display: grid;
      place-items: center;
      padding: 17px 20px;
      border: 1px solid rgba(177, 151, 225, 0.68);
      border-radius: 5px;
      color: #ffffff;
      background: var(--button-fill);
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease,
        transform 180ms cubic-bezier(0.22, 0.75, 0.3, 1);
    }

    .link:hover {
      border-color: var(--ink);
      background: var(--button-hover);
      transform: translateY(-3px) scale(1.015);
    }

    .link:focus-visible,
    .discord:focus-visible,
    .email:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 13px;
      font-size: 18px;
    }

    .discord,
    .email {
      position: relative;
      padding: 0;
      border: 0;
      color: var(--ink-dark);
      background: transparent;
      font: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
      transition: color 180ms ease, transform 180ms ease;
    }

    .discord::after,
    .email::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -10px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      opacity: 0;
      background: var(--ink-dark);
      box-shadow: 0 0 8px rgba(150, 119, 206, 0.5);
      transform: translateY(-50%) scale(0.25);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 0.75, 0.3, 1);
    }

    .discord.is-confirmed,
    .email.is-confirmed {
      color: var(--focus);
      transform: translateY(-1px);
    }

    .discord.is-confirmed::after,
    .email.is-confirmed::after {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .discord.is-error::after {
      opacity: 1;
      background: #bd7798;
      transform: translateY(-50%) scale(1);
    }

    .discord:active,
    .email:active {
      transform: scale(0.97);
    }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .email-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
      transition: fill 180ms ease, transform 180ms ease;
    }

    .email.is-confirmed .email-icon {
      fill: rgba(150, 119, 206, 0.16);
      transform: scale(1.1);
    }

    .discord-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 580px) {
      body {
        align-items: center;
        font-size: 17px;
      }

      main {
        width: min(100%, 360px);
      }

      .profile {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 19px;
      }

      .pfp-wrap {
        width: clamp(140px, 45vw, 174px);
      }

      .content {
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: clamp(50px, 16vw, 68px);
      }

      .intro {
        margin: 8px 0 14px;
        font-size: 19px;
      }

      .link {
        min-height: 58px;
        padding: 13px 16px;
        font-size: 22px;
      }

      .contact {
        justify-content: center;
        font-size: 16px;
      }
    }

    @media (max-width: 340px) {
      .links {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

    }
  </style>
</head>

<body>
  <noscript><style>main, #fx { opacity: 1 !important; transform: none !important; }</style></noscript>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main>
    <section class="profile" aria-labelledby="site-title">
      <div class="pfp-wrap">
        <img class="pfp" src="img/frazyypfp.png" alt="frazyy">
        <img class="deco"
          src="https://cdn.discordapp.com/avatar-decoration-presets/a_c3cffc19e9784f7d0b005eecdf1b566e.png?size=240&amp;passthrough=true"
          alt="" aria-hidden="true">
      </div>

      <div class="content">
        <h1 id="site-title">frazyy</h1>
        <p class="intro">cat content creator</p>

        <nav class="links" aria-label="links">
          <a class="link" href="https://www.youtube.com/@frazyypaws" target="_blank" rel="noopener noreferrer">youtube</a>
          <a class="link" href="https://www.instagram.com/frazyypaws/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a class="link" href="https://x.com/frazyypaws" target="_blank" rel="noopener noreferrer">twitter</a>
          <a class="link" href="https://www.tiktok.com/@frazyypaws" target="_blank" rel="noopener noreferrer">tiktok</a>
        </nav>

        <div class="contact" aria-label="contact">
          <button class="discord" id="discord-copy" type="button" title="copy discord">
            discord: @frazyypaws<span class="discord-status" id="discord-status" aria-live="polite"></span>
          </button>
          <a class="email" href="mailto:contact@frazyy.com">
            <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <span>contact@frazyy.com</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/performanceProfile.js"></script>
  <script src="js/siteParticles.js"></script>
  <script>
    let shown = false;

    function showPage() {
      if (shown) return;
      shown = true;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.replace("is-loading", "is-ready");
        });
      });
    }

    const pfp = document.querySelector(".pfp");
    const deco = document.querySelector(".deco");
    const fontLoad = document.fonts?.ready || Promise.resolve();
    const pfpLoad = pfp?.decode
      ? pfp.decode().catch(() => undefined)
      : Promise.resolve();
    const decoLoad = deco?.decode
      ? deco.decode().catch(() => undefined)
      : Promise.resolve();
    const fallback = setTimeout(showPage, 1400);

    Promise.all([fontLoad, pfpLoad, decoLoad]).then(() => {
      clearTimeout(fallback);
      showPage();
    });

    const copyButton = document.querySelector("#discord-copy");
    const copyStatus = document.querySelector("#discord-status");
    const emailLink = document.querySelector(".email");
    const feedbackTimers = new WeakMap();
    let statusTimer;

    function showFeedback(element, state = "is-confirmed") {
      clearTimeout(feedbackTimers.get(element));
      element.classList.remove("is-confirmed", "is-error");
      void element.offsetWidth;
      element.classList.add(state);
      feedbackTimers.set(element, setTimeout(() => {
        element.classList.remove(state);
      }, 700));
    }

    copyButton.addEventListener("click", async () => {
      clearTimeout(statusTimer);

      try {
        await navigator.clipboard.writeText("frazyypaws");
        copyStatus.textContent = "copied!";
        showFeedback(copyButton);
      } catch {
        copyStatus.textContent = "copy unavailable";
        showFeedback(copyButton, "is-error");
      }

      statusTimer = setTimeout(() => {
        copyStatus.textContent = "";
      }, 1800);
    });

    emailLink.addEventListener("click", () => {
      showFeedback(emailLink);
    });
  </script>
</body>
</html>
