<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfe">
  <meta name="description" content="Frazyy's links, socials, and contact information.">
  <link rel="icon" href="img/frazyypfp.jpg">
  <title>frazyy.com</title>

  <style>
    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientifica.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaItalic.ttf") format("truetype");
      font-style: italic;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --top: #fcfbfe;
      --bottom: #e4dbf5;
      --ink: #b197e1;
      --ink-dark: #9677ce;
      --button-fill: rgba(177, 151, 225, 0.12);
      --button-hover: rgba(177, 151, 225, 0.22);
      --focus: #7552b4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      overflow-x: hidden;
      color: var(--ink);
      background: linear-gradient(180deg, var(--top) 0%, var(--top) 36%, var(--bottom) 100%);
      font-family: "Scientifica", monospace;
      font-size: 18px;
      line-height: 1.35;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(100%, 650px);
    }

    .profile {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      align-items: center;
      gap: 28px;
    }

    .portrait {
      display: block;
      width: 190px;
      aspect-ratio: 1;
      border: 2px solid rgba(177, 151, 225, 0.6);
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 9px 26px rgba(116, 82, 180, 0.12);
    }

    .content {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink-dark);
      font-size: clamp(54px, 7vw, 76px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: 0.08em;
    }

    .intro {
      margin: 9px 0 14px;
      font-size: 20px;
    }

    .handle {
      font-weight: 700;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .link {
      min-height: 58px;
      display: grid;
      place-items: center;
      padding: 13px 16px;
      border: 1px solid rgba(177, 151, 225, 0.68);
      border-radius: 5px;
      color: var(--ink-dark);
      background: var(--button-fill);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      text-decoration: none;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .link:hover {
      border-color: var(--ink);
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .link:focus-visible,
    .discord:focus-visible,
    .email:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 13px;
      font-size: 16px;
    }

    .discord,
    .email {
      padding: 0;
      border: 0;
      color: var(--ink-dark);
      background: transparent;
      font: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .discord-status {
      display: inline-block;
      min-width: 42px;
      margin-left: 3px;
      font-style: italic;
      text-decoration: none;
    }

    @media (max-width: 580px) {
      body {
        align-items: center;
        font-size: 17px;
      }

      main {
        width: min(100%, 360px);
      }

      .profile {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 19px;
      }

      .portrait {
        width: clamp(140px, 45vw, 174px);
      }

      .content {
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: clamp(50px, 16vw, 68px);
      }

      .intro {
        margin: 8px 0 14px;
        font-size: 19px;
      }

      .contact {
        justify-content: center;
      }
    }

    @media (max-width: 340px) {
      .links {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="profile" aria-labelledby="site-title">
      <img class="portrait" src="img/frazyypfp.jpg" alt="Frazyy's illustrated character portrait">

      <div class="content">
        <h1 id="site-title">frazyy</h1>
        <p class="intro">hi, i'm <span class="handle">@frazyypaws</span> :3</p>

        <nav class="links" aria-label="Social links">
          <a class="link" href="https://www.youtube.com/@frazyypaws" target="_blank" rel="noopener noreferrer">youtube</a>
          <a class="link" href="https://www.instagram.com/frazyypaws/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a class="link" href="https://x.com/frazyypaws" target="_blank" rel="noopener noreferrer">twitter</a>
          <a class="link" href="https://www.tiktok.com/@frazyypaws" target="_blank" rel="noopener noreferrer">tiktok</a>
        </nav>

        <div class="contact" aria-label="Contact information">
          <button class="discord" id="discord-copy" type="button" title="Copy Discord username">
            discord: @frazyypaws<span class="discord-status" id="discord-status" aria-live="polite"></span>
          </button>
          <a class="email" href="mailto:contact@frazyy.com">email me</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    const copyButton = document.querySelector("#discord-copy");
    const copyStatus = document.querySelector("#discord-status");
    let statusTimer;

    copyButton.addEventListener("click", async () => {
      clearTimeout(statusTimer);

      try {
        await navigator.clipboard.writeText("frazyypaws");
        copyStatus.textContent = "copied!";
      } catch {
        copyStatus.textContent = "@frazyypaws";
      }

      statusTimer = setTimeout(() => {
        copyStatus.textContent = "";
      }, 1800);
    });
  </script>
</body>
</html>
