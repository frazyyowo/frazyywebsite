<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbfe">
  <meta name="description" content="Frazyy — cat content creator. Videos, socials, and contact.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://frazyy.com/">
  <meta property="og:site_name" content="FRAZYY">
  <meta property="og:title" content="FRAZYY">
  <meta property="og:description" content="cat content creator">
  <meta property="og:image" content="https://frazyy.com/img/frazyypfp.png">
  <meta property="og:image:alt" content="Frazyy's illustrated character portrait">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FRAZYY">
  <meta name="twitter:description" content="cat content creator">
  <meta name="twitter:image" content="https://frazyy.com/img/frazyypfp.png">
  <link rel="icon" href="img/frazyypfp.png">
  <title>FRAZYY</title>

  <style>
    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientifica.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaBold.ttf") format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Scientifica";
      src: url("fonts/scientificaItalic.ttf") format("truetype");
      font-style: italic;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --top: #fcfbfe;
      --ink: #b197e1;
      --ink-dark: #9677ce;
      --button-fill: #b197e1;
      --button-hover: #a486d8;
      --focus: #7552b4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      color: var(--ink);
      background: var(--top);
      font-family: "Scientifica", monospace;
      font-size: 20px;
      line-height: 1.35;
      text-rendering: optimizeLegibility;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
    }

    #fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      filter: blur(0.6px);
    }

    .profile {
      display: grid;
      grid-template-columns: 225px minmax(0, 1fr);
      align-items: center;
      gap: 34px;
    }

    .portrait {
      display: block;
      width: 225px;
      aspect-ratio: 1;
      border: 2px solid rgba(177, 151, 225, 0.6);
      border-radius: 50%;
      object-fit: cover;
    }

    .content {
      min-width: 0;
    }

    h1 {
      margin: 0;
      color: var(--ink-dark);
      font-size: clamp(62px, 7vw, 84px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-shadow: 0 0 7px rgba(177, 151, 225, 0.32), 0 0 18px rgba(177, 151, 225, 0.18);
    }

    .intro {
      margin: 11px 0 17px;
      font-size: 23px;
    }

    .handle {
      font-weight: 700;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .link {
      min-height: 70px;
      display: grid;
      place-items: center;
      padding: 17px 20px;
      border: 1px solid rgba(177, 151, 225, 0.68);
      border-radius: 5px;
      color: #ffffff;
      background: var(--button-fill);
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      text-decoration: none;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .link:hover {
      border-color: var(--ink);
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .link:focus-visible,
    .discord:focus-visible,
    .email:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin-top: 13px;
      font-size: 18px;
    }

    .discord,
    .email {
      padding: 0;
      border: 0;
      color: var(--ink-dark);
      background: transparent;
      font: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .email {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .email-icon {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .discord-status {
      display: inline-block;
      min-width: 42px;
      margin-left: 3px;
      font-style: italic;
      text-decoration: none;
    }

    @media (max-width: 580px) {
      body {
        align-items: center;
        font-size: 17px;
      }

      main {
        width: min(100%, 360px);
      }

      .profile {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 19px;
      }

      .portrait {
        width: clamp(140px, 45vw, 174px);
      }

      .content {
        width: 100%;
        text-align: center;
      }

      h1 {
        font-size: clamp(50px, 16vw, 68px);
      }

      .intro {
        margin: 8px 0 14px;
        font-size: 19px;
      }

      .link {
        min-height: 58px;
        padding: 13px 16px;
        font-size: 22px;
      }

      .contact {
        justify-content: center;
        font-size: 16px;
      }
    }

    @media (max-width: 340px) {
      .links {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

    }
  </style>
</head>

<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main>
    <section class="profile" aria-labelledby="site-title">
      <img class="portrait" src="img/frazyypfp.png" alt="Frazyy's illustrated character portrait">

      <div class="content">
        <h1 id="site-title">frazyy</h1>
        <p class="intro">cat content creator</p>

        <nav class="links" aria-label="Social links">
          <a class="link" href="https://www.youtube.com/@frazyypaws" target="_blank" rel="noopener noreferrer">youtube</a>
          <a class="link" href="https://www.instagram.com/frazyypaws/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a class="link" href="https://x.com/frazyypaws" target="_blank" rel="noopener noreferrer">twitter</a>
          <a class="link" href="https://www.tiktok.com/@frazyypaws" target="_blank" rel="noopener noreferrer">tiktok</a>
        </nav>

        <div class="contact" aria-label="Contact information">
          <button class="discord" id="discord-copy" type="button" title="Copy Discord username">
            discord: @frazyypaws<span class="discord-status" id="discord-status" aria-live="polite"></span>
          </button>
          <a class="email" href="mailto:contact@frazyy.com">
            <svg class="email-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <span>contact@frazyy.com</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/performanceProfile.js"></script>
  <script src="js/siteParticles.js"></script>
  <script src="js/titleMarquee.js"></script>
  <script>
    const copyButton = document.querySelector("#discord-copy");
    const copyStatus = document.querySelector("#discord-status");
    let statusTimer;

    copyButton.addEventListener("click", async () => {
      clearTimeout(statusTimer);

      try {
        await navigator.clipboard.writeText("frazyypaws");
        copyStatus.textContent = "copied!";
      } catch {
        copyStatus.textContent = "@frazyypaws";
      }

      statusTimer = setTimeout(() => {
        copyStatus.textContent = "";
      }, 1800);
    });
  </script>
</body>
</html>
