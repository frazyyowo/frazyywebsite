<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>frazyy.com</title>

  <script src="js/performanceProfile.js?v=perf-1" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;700;800;900&display=swap">
  <link rel="stylesheet" href="css/effects.css?v=perf-1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    body {
      font-family: "Azeret Mono", ui-monospace, SFMono-Regular, Menlo, Monaco,
                   Consolas, "Liberation Mono", "Courier New", monospace;
      background: #a8c8e8;
      color: #111;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      touch-action: manipulation;
    }

    #bg, #tint, #fx, #vhs {
      pointer-events: none;
    }

    #mobile-root {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(100%, 520px);
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    }

    .site-title {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: clamp(32px, 9vw, 50px);
      font-weight: 700;
      letter-spacing: 3px;
      color: #141414;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.45);
      user-select: none;
      line-height: 1;
      padding: 10px 0 6px;
      min-height: 48px;
    }

    .site-title .tw-text { white-space: nowrap; }

    .site-title .tw-cursor {
      display: inline-block;
      margin-left: 2px;
      animation: tw-blink 0.9s steps(1) infinite;
    }

    @keyframes tw-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .m-card {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.50);
      background:
        radial-gradient(130% 80% at 18% 8%, rgba(255,255,255,0.60), transparent 55%),
        linear-gradient(175deg, rgba(255,255,255,0.54), rgba(255,255,255,0.20));
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.60);
      padding: 12px 10px;
      position: relative;
      overflow: hidden;
    }

    .m-welcome-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.25;
      text-align: center;
    }

    .m-sep {
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.32);
      margin: 14px 0;
    }

    .m-links-label,
    .discord-label {
      font-size: 13px;
      font-weight: 800;
      opacity: 0.86;
      margin-bottom: 10px;
      text-transform: lowercase;
    }

    .m-links-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .m-link-item {
      display: flex;
      align-items: center;
      flex-direction: row;
      justify-content: flex-start;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      height: auto;
      padding: 8px 12px;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      background:
        radial-gradient(100px 70px at 18% 20%, rgba(255,255,255,0.52), transparent 65%),
        linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.18));
      border: 1px solid rgba(0,0,0,0.13);
      box-shadow: 0 4px 8px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.50);
      transition:
        transform 220ms cubic-bezier(.16,.84,.3,1),
        filter 220ms ease,
        background 220ms ease,
        box-shadow 220ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) and (pointer: fine) {
      .m-link-item:hover {
        transform: translateY(-3px) scale(1.025);
        box-shadow:
          0 10px 22px rgba(80, 135, 190, 0.22),
          inset 0 1px 0 rgba(255,255,255,0.66);
      }

      .m-link-item:hover .m-link-icon {
        transform: scale(1.08);
      }
    }

    .m-link-item:active {
      transform: scale(0.985);
    }

    .m-link-icon,
    .m-link-icon img {
      width: 42px;
      height: 42px;
    }

    .m-link-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      transition: transform 220ms cubic-bezier(.16,.84,.3,1);
    }

    .m-link-icon img {
      object-fit: contain;
      display: block;
    }

    .youtube-icon {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: linear-gradient(145deg, #ff1744, #d9002c);
      box-shadow:
        0 0 7px rgba(255,23,68,0.34),
        inset 0 1px 0 rgba(255,255,255,0.24);
    }

    .youtube-fallback {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 20px;
      line-height: 1;
      transform: translateX(2px);
      text-shadow: 0 1px 2px rgba(0,0,0,0.24);
    }

    .youtube-gif {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
    }

    .youtube-icon.has-youtube-gif {
      overflow: visible;
      background: transparent;
      box-shadow: none;
    }

    .youtube-icon.has-youtube-gif .youtube-fallback {
      display: none;
    }

    .youtube-icon.has-youtube-gif .youtube-gif {
      opacity: 1;
    }

    .m-link-icon-text {
      display: grid;
      place-items: center;
      color: rgba(17,17,17,0.86);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -1px;
      border: 2px solid rgba(17,17,17,0.72);
      border-radius: 8px;
    }

    .m-link-label {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14px;
      font-weight: 900;
      opacity: 0.92;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: lowercase;
    }

    .m-link-arrow {
      flex: 0 0 auto;
      margin-left: auto;
      font-size: 14px;
      font-weight: 900;
      opacity: 0.45;
    }

    .discord-wrap {
      margin-top: 8px;
    }

    .discord-badge {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.16);
      background:
        radial-gradient(140px 90px at 22% 18%, rgba(255,255,255,0.55), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,0.48), rgba(255,255,255,0.20));
      box-shadow: 0 8px 16px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.55);
      color: #111;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-align: left;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 220ms cubic-bezier(.16,.84,.3,1),
        filter 220ms ease,
        box-shadow 220ms ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .discord-badge:hover {
        transform: translateY(-2px) scale(1.012);
      }
    }

    .discord-badge:active {
      transform: scale(0.985);
    }

    .discord-pfp-ring {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      padding: 3px;
      flex: 0 0 auto;
      background: conic-gradient(rgba(120,200,255,0.95), rgba(255,255,255,0.85), rgba(180,120,255,0.85), rgba(120,200,255,0.95));
    }

    .discord-pfp {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      display: block;
      object-fit: cover;
      background: rgba(255,255,255,0.35);
      border: 1px solid rgba(0,0,0,0.18);
    }

    .discord-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .discord-name {
      font-weight: 900;
      font-size: 12px;
      line-height: 1.08;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .discord-user,
    .discord-activity {
      font-size: 10px;
      line-height: 1.15;
      opacity: 0.82;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .discord-activity {
      opacity: 0.76;
    }

    .discord-copied {
      position: absolute;
      top: 9px;
      right: 11px;
      font-size: 10px;
      font-weight: 900;
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .discord-badge.copied .discord-copied {
      opacity: 1;
    }

    .contact-mail {
      margin-top: auto;
      padding-top: 8px;
      text-align: center;
      font-size: 12px;
      line-height: 1.25;
      font-weight: 900;
      opacity: 0.86;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.45);
    }

    .contact-mail a {
      color: inherit;
      text-decoration: none;
    }

    .contact-mail a:active {
      opacity: 0.72;
    }

    @media (max-width: 380px) {
      #mobile-root {
        padding-left: 10px;
        padding-right: 10px;
      }

      .m-card {
        padding-left: 12px;
        padding-right: 12px;
      }

      .site-title {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>
  <video id="bg" autoplay muted loop playsinline preload="metadata"
         disablepictureinpicture disableremoteplayback aria-hidden="true">
    <source src="img/backround1-mobile.mp4?v=perf-1" type="video/mp4" media="(max-width: 760px)">
    <source src="img/backround1.mp4?v=perf-1" type="video/mp4">
  </video>
  <div id="tint"></div>
  <div id="vhs"></div>

  <main id="mobile-root">
    <h1 class="site-title" data-type="frazyy.com" aria-label="frazyy.com">frazyy.com_</h1>

    <section class="m-card" aria-label="welcome">
      <div class="m-welcome-title">welcome to my website!</div>

      <div class="m-sep"></div>

      <div class="m-links-label">my links:</div>

      <div class="m-links-list">
        <a class="m-link-item" href="https://www.youtube.com/@frazyypaws" target="_blank" rel="noopener noreferrer">
          <div class="m-link-icon youtube-icon">
            <span class="youtube-fallback" aria-hidden="true">▶</span>
            <img class="youtube-gif" src="img/youtube.gif" alt="youtube">
          </div>
          <div class="m-link-label">youtube</div>
          <div class="m-link-arrow" aria-hidden="true">&rsaquo;</div>
        </a>

        <a class="m-link-item" href="https://www.instagram.com/frazyypaws/" target="_blank" rel="noopener noreferrer">
          <div class="m-link-icon"><img src="img/instagram.gif" alt="instagram"></div>
          <div class="m-link-label">instagram</div>
          <div class="m-link-arrow" aria-hidden="true">&rsaquo;</div>
        </a>

        <a class="m-link-item" href="https://x.com/frazyypaws" target="_blank" rel="noopener noreferrer">
          <div class="m-link-icon"><img src="img/twitter.gif" alt="twitter"></div>
          <div class="m-link-label">twitter</div>
          <div class="m-link-arrow" aria-hidden="true">&rsaquo;</div>
        </a>

        <a class="m-link-item" href="https://toyhou.se/frazyy" target="_blank" rel="noopener noreferrer">
          <div class="m-link-icon"><img src="img/toyhouse.gif?v=33fb0df" alt="toyhouse"></div>
          <div class="m-link-label">toyhouse</div>
          <div class="m-link-arrow" aria-hidden="true">&rsaquo;</div>
        </a>

      </div>

      <div class="discord-wrap">
        <div class="discord-label">my discord:</div>

        <button class="discord-badge" id="discordCard" type="button" aria-label="Copy Discord username">
          <div class="discord-pfp-ring">
            <img class="discord-pfp" id="discordPfp" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="">
          </div>

          <div class="discord-meta">
            <div class="discord-name" id="discordName">loading...</div>
            <div class="discord-user" id="discordUser">@frazyypaws</div>
            <div class="discord-activity" id="discordActivity">loading activity...</div>
          </div>

          <div class="discord-copied" id="discordCopied" aria-hidden="true">copied!</div>
        </button>
      </div>
    </section>

    <footer class="contact-mail">
      my contact mail:
      <a href="mailto:contact@frazyy.com">contact@frazyy.com</a>
    </footer>

  </main>

  <script>
    document.getElementById('discordCard')?.addEventListener('click', () => {
      navigator.clipboard?.writeText('frazyypaws').catch(() => {});
      const card = document.getElementById('discordCard');
      card?.classList.add('copied');
      setTimeout(() => card?.classList.remove('copied'), 1600);
    });

    document.querySelectorAll('.youtube-gif').forEach(image => {
      const icon = image.closest('.youtube-icon');
      if (!icon) return;
      const showImage = () => icon.classList.add('has-youtube-gif');
      const hideImage = () => icon.classList.remove('has-youtube-gif');
      image.addEventListener('load', showImage);
      image.addEventListener('error', hideImage);
      if (image.complete) {
        if (image.naturalWidth) showImage();
        else hideImage();
      }
    });
  </script>

  <script src="js/typewriter.js?v=mobile-1" defer></script>
  <script src="js/discordBadge.js?v=perf-1" defer></script>
</body>
</html>
